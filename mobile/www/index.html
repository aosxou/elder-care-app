<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width">
    <title>Elder Care Mobile</title>

    <!-- Cordova 스크립트 -->
    <script src="cordova.js"></script>

    <!-- 외부 라이브러리 -->
    <!-- TODO: 차트 라이브러리 추가 -->
    <!-- <script src="lib/chart.min.js"></script> -->

    <!-- 스타일시트 -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!--
        TODO: 스플래시 화면
        - 앱 로고
        - 로딩 스피너
    -->

    <!-- 메인 컨테이너 -->
    <div id="app" class="app-container">
        <!-- 헤더 -->
        <header id="header" class="header">
            <h1 id="headerTitle">Elder Care</h1>
            <div class="header-buttons">
                <button id="menuButton" class="btn-icon">☰</button>
                <button id="notificationButton" class="btn-icon">
                    🔔
                    <span id="notificationBadge" class="badge" style="display: none;">0</span>
                </button>
            </div>
        </header>

        <!-- 메인 컨텐츠 -->
        <main id="mainContent" class="main-content">
            <!-- 로그인 화면 -->
            <section id="loginScreen" class="screen active">
                <div class="login-container">
                    <h2>Elder Care</h2>
                    <p>노인 돌봄 관리 시스템</p>

                    <form id="loginForm">
                        <input type="email" id="email" placeholder="이메일" required>
                        <input type="password" id="password" placeholder="비밀번호" required>
                        <button type="submit" class="btn btn-primary">로그인</button>
                    </form>

                    <p class="login-footer">
                        <a href="#" id="signupLink">회원가입</a> |
                        <a href="#" id="forgotLink">비밀번호 찾기</a>
                    </p>

                    <!-- TODO: 소셜 로그인 추가 -->
                </div>
            </section>

            <!-- 대시보드 화면 -->
            <section id="dashboardScreen" class="screen">
                <!--
                    TODO: 대시보드 구현
                    - 노인 목록 (보호자인 경우)
                    - 건강 지표 요약
                    - 최근 활동
                    - 긴급 알림
                -->
                <div class="dashboard">
                    <h2>대시보드</h2>

                    <!-- 건강 상태 카드 -->
                    <div class="card health-card">
                        <h3>건강 상태</h3>
                        <div class="health-indicators">
                            <div class="indicator">
                                <span class="label">혈압</span>
                                <span id="bloodPressure" class="value">--</span>
                            </div>
                            <div class="indicator">
                                <span class="label">맥박</span>
                                <span id="pulse" class="value">--</span>
                            </div>
                            <div class="indicator">
                                <span class="label">혈당</span>
                                <span id="bloodSugar" class="value">--</span>
                            </div>
                        </div>
                    </div>

                    <!-- 활동 카드 -->
                    <div class="card activity-card">
                        <h3>오늘 활동</h3>
                        <div id="activitySummary" class="activity-summary">
                            <!-- TODO: 활동 데이터 동적 로드 -->
                        </div>
                    </div>

                    <!-- 약물 복용 카드 -->
                    <div class="card medicine-card">
                        <h3>약물 복용</h3>
                        <div id="medicineList" class="medicine-list">
                            <!-- TODO: 약물 목록 동적 로드 -->
                        </div>
                    </div>

                    <!-- 빠른 액션 -->
                    <div class="quick-actions">
                        <button id="callButton" class="action-btn">
                            📞<br>음성통화
                        </button>
                        <button id="videoCallButton" class="action-btn">
                            📹<br>영상통화
                        </button>
                        <button id="chatButton" class="action-btn">
                            💬<br>메시지
                        </button>
                        <button id="healthButton" class="action-btn">
                            ❤️<br>건강 입력
                        </button>
                    </div>
                </div>
            </section>

            <!-- 건강 관리 화면 -->
            <section id="healthScreen" class="screen">
                <h2>건강 관리</h2>
                <!-- TODO: 건강 기록 입력 폼 -->
                <!-- TODO: 건강 이력 조회 -->
                <!-- TODO: 건강 차트 표시 -->
            </section>

            <!-- 메시지 화면 -->
            <section id="messageScreen" class="screen">
                <h2>메시지</h2>
                <!-- TODO: 대화 목록 표시 -->
                <!-- TODO: 메시지 입력 폼 -->
                <!-- TODO: WebSocket 연결 -->
            </section>

            <!-- 통화 화면 -->
            <section id="callScreen" class="screen">
                <h2>통화</h2>
                <!-- TODO: 통화 관련 UI -->
                <!-- TODO: WebRTC 연결 -->
                <!-- TODO: 통화 컨트롤 -->
            </section>

            <!-- 설정 화면 -->
            <section id="settingScreen" class="screen">
                <h2>설정</h2>
                <!-- TODO: 알림 설정 -->
                <!-- TODO: 계정 설정 -->
                <!-- TODO: 앱 설정 -->
                <!-- TODO: 로그아웃 -->
            </section>
        </main>

        <!-- 네비게이션 탭 -->
        <nav id="bottomNav" class="bottom-nav">
            <button class="nav-btn active" data-screen="dashboard">
                🏠 대시보드
            </button>
            <button class="nav-btn" data-screen="health">
                ❤️ 건강
            </button>
            <button class="nav-btn" data-screen="message">
                💬 메시지
            </button>
            <button class="nav-btn" data-screen="setting">
                ⚙️ 설정
            </button>
        </nav>

        <!-- 로딩 스피너 -->
        <div id="loadingSpinner" class="loading-spinner" style="display: none;">
            <div class="spinner"></div>
        </div>

        <!-- 토스트 알림 -->
        <div id="toastNotification" class="toast-notification"></div>
    </div>

    <!-- 자바스크립트 파일 로드 순서 중요! -->
    <script src="js/api.js"></script>
    <script src="js/notification.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/webrtc.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
