# ====================================
# Spring Boot 애플리케이션 설정
# ====================================

spring:
  application:
    name: elder-care-backend
    version: 1.0.0

  # ====================================
  # JPA/Hibernate 설정
  # ====================================
  jpa:
    hibernate:
      ddl-auto: validate  # TODO: 환경별로 update/create로 변경
    show-sql: false  # TODO: 개발 환경에서 true로 변경
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true

  # ====================================
  # DataSource 설정 (PostgreSQL)
  # ====================================
  datasource:
    # TODO: 환경 변수로 관리하기
    url: jdbc:postgresql://localhost:5432/eldercare_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000

  # ====================================
  # 로깅 설정
  # ====================================
  logging:
    level:
      root: INFO
      com.eldercare: DEBUG
      org.springframework.web: DEBUG
      org.springframework.security: DEBUG
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
      file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  # ====================================
  # WebSocket 설정
  # ====================================
  websocket:
    # TODO: STOMP endpoint 설정
    endpoint: /ws
    allowed-origins: "http://localhost:3000,http://localhost:8080"

  # ====================================
  # Spring AI 설정 (Ollama)
  # ====================================
  ai:
    ollama:
      # TODO: Ollama 서버 주소 설정
      base-url: http://localhost:11434
      model: mistral  # TODO: 모델 선택 (mistral, neural-chat 등)
    chat:
      client-type: ollama

  # ====================================
  # 보안 설정
  # ====================================
  security:
    jwt:
      # TODO: 환경 변수로 관리하기
      secret: your-super-secret-jwt-key-change-this-in-production
      expiration: 86400000  # 24시간 (밀리초)
      refresh-expiration: 604800000  # 7일

# ====================================
# 서버 설정
# ====================================
server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
  compression:
    enabled: true
    min-response-size: 1024

# ====================================
# 액추에이터 설정 (모니터링)
# ====================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics  # TODO: 프로덕션에서 제한
  endpoint:
    health:
      show-details: when-authorized  # TODO: 프로덕션에서 변경

# ====================================
# 애플리케이션 커스텀 설정
# ====================================
app:
  name: Elder Care Management System
  description: 노인 돌봄 관리 시스템
  version: 1.0.0

  # 알림 설정
  notification:
    # TODO: 이메일, SMS 프로바이더 설정
    enabled: true
    mail:
      smtp-host: smtp.gmail.com
      smtp-port: 587
      from: noreply@eldercare.com
    sms:
      provider: twilio  # TODO: SMS 프로바이더 선택

  # WebRTC 설정
  webrtc:
    # TODO: TURN/STUN 서버 설정
    ice-servers:
      - urls:
          - stun:stun.l.google.com:19302
          - stun:stun1.l.google.com:19302
    enable-renegotiation: true
    enable-datachannels: true

  # AI 설정
  ai:
    # TODO: 모델 파라미터 조정
    max-tokens: 2048
    temperature: 0.7
    top-p: 0.9
    enable-streaming: true

  # 파일 업로드 설정
  file-upload:
    # TODO: 파일 경로 설정
    max-file-size: 10485760  # 10MB
    allowed-extensions: jpg,jpeg,png,pdf,txt
    upload-dir: /uploads

---
# ====================================
# 개발 프로필 (dev)
# ====================================
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: create-drop  # 개발 중에는 자동 생성/삭제
    show-sql: true

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

logging:
  level:
    root: INFO
    com.eldercare: DEBUG

# TODO: 개발 환경별 WebRTC, AI 설정

---
# ====================================
# 프로덕션 프로필 (prod)
# ====================================
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: WARN
    com.eldercare: INFO

# TODO: 프로덕션 환경 보안 설정 강화
