<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elder Care - 로그인</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .logo p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ecf0f1;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .remember-forgot a {
            color: #667eea;
            text-decoration: none;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 44px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
            font-size: 14px;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background-color: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .error-message.show {
            display: block;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /*
            TODO: 소셜 로그인 추가
            TODO: 이메일 인증
            TODO: 비밀번호 재설정 페이지
        */
    </style>
</head>

<body>
    <div class="login-container">
        <div class="logo">
            <h1>👵 Elder Care</h1>
            <p>노인 돌봄 관리 시스템</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">이메일</label>
                <input
                    type="email"
                    id="email"
                    placeholder="your@email.com"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                    required
                    autocomplete="current-password"
                >
            </div>

            <div class="remember-forgot">
                <label style="display: flex; gap: 6px; margin: 0; font-weight: normal;">
                    <input type="checkbox" id="remember">
                    <span>로그인 유지</span>
                </label>
                <a href="#" onclick="alert('비밀번호 재설정 페이지 준비 중입니다'); return false;">
                    비밀번호 찾기
                </a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <div class="btn-content">
                    <span>로그인</span>
                    <div class="loading-spinner" id="loadingSpinner"></div>
                </div>
            </button>
        </form>

        <div class="signup-link">
            계정이 없으신가요?
            <a href="#" onclick="alert('회원가입 페이지 준비 중입니다'); return false;">
                회원가입
            </a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        /**
         * 로그인 페이지 로직
         *
         * TODO: 입력값 검증
         * TODO: 로그인 성공 시 대시보드로 리다이렉트
         * TODO: 로그인 실패 시 에러 메시지 표시
         */

        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            // 에러 메시지 숨기기
            errorMessage.classList.remove('show');

            // 로딩 상태
            loginBtn.disabled = true;
            loadingSpinner.style.display = 'inline-block';

            try {
                // API 호출
                const response = await API.login(email, password);

                if (response.success) {
                    // 인증 토큰 저장
                    localStorage.setItem('authToken', response.token);
                    localStorage.setItem('user', JSON.stringify(response.user));

                    if (remember) {
                        localStorage.setItem('rememberEmail', email);
                    }

                    // 대시보드로 리다이렉트
                    window.location.href = 'index.html';
                } else {
                    showError(response.error || '로그인에 실패했습니다');
                }
            } catch (error) {
                console.error('로그인 오류:', error);
                showError('로그인 중 오류가 발생했습니다. 다시 시도해주세요.');
            } finally {
                loginBtn.disabled = false;
                loadingSpinner.style.display = 'none';
            }
        });

        /**
         * 에러 메시지 표시
         */
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        /**
         * 페이지 로드 시 저장된 이메일 복원
         */
        window.addEventListener('load', () => {
            const savedEmail = localStorage.getItem('rememberEmail');
            if (savedEmail) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('remember').checked = true;
            }

            // 이미 로그인한 경우 대시보드로 리다이렉트
            if (localStorage.getItem('authToken')) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>

</html>
